    observed_behavior:
      "Replaces the schema-2 provider/workspace/path/scope model with
      schema-3 storage. New modules: errors, manifest (v3 parser and overlay), overrides,
      tomlio (round-trip TOML ownership), storage_paths (pure path formulas), storage_binding
      (.ledger-project.toml markers), and migration (planned, verified, journaled storage
      migration with planning and execution APIs). Tool config is fixed at .ledger/<tool>/config.toml;
      mount paths are derived from project UUID, tool name, mount name, storage kind,
      and checkout identity. Adds tomlkit dependency. Schema 2 remains readable for
      migration with a deprecation warning."
